<header class="bar" id="bar">

    <a class="brand" href="#top">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name brand__name--builder">Nur</span>

    </a>

    <nav class="nav" aria-label="Primary">
      <div class="nav__set nav__set--builder"><!-- professional-nav --></div>
      <div class="nav__set nav__set--creator">
        <a href="#worlds">Projects</a>
        <a href="#craft">Process</a>
        <a href="#tools">Tools</a>
        <a href="#play">Contact</a>
      </div>
    </nav>

    <div class="bar__actions">

      <button class="icon icon--burger" data-menu type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu">

      </button>
    </div>
  </div>

  <div class="menu" id="menu" hidden>
    <div class="wrap">
      <div class="nav__set nav__set--builder"><!-- professional-nav --></div>
      <div class="nav__set nav__set--creator">
